<body>
    <script>
        var lengthOfLISSearch = function (nums) {
            const n = nums.length;
            if (n <= 1) return n;
            let tail = [nums[0]];
            for (let i = 0; i < n; i++) {
                //当nums中的元素比tail中的最后一个大时 可以放心push进tail
                if (nums[i] > tail[tail.length - 1]) {
                    tail.push(nums[i]);
                } else {
                    let left = 0, right = tail.length - 1; // 闭区间
                    while (left < right) {
                        const mid = Math.floor((left + right) / 2);
                        if (tail[mid] < nums[i]) {
                            left = mid + 1;
                        } else {
                            right = mid - 1;
                        }
                    }
                    tail[left] = nums[i];
                }
            }
            console.log('tail: ', tail);
            return tail.length;
        }
        const nums = [10, 9, 2, 5, 3, 7, 101, 18]; // 4
        console.log('lengthOfLISSearch: ', lengthOfLISSearch(nums));
        var findDuplicate = function (nums) {
            let slow = 0, fast = 0;
            while (true) {
                slow = nums[slow];
                fast = nums[nums[fast]];
                if (slow === fast) break;
            }
            let head = 0;
            while (slow !== head) {
                slow = nums[slow];
                head = nums[head];
            }
            return slow;
        }
        console.log(findDuplicate([1, 3, 4, 2, 2]));
    </script>
</body>
